    <!-- Le SVG d'abord : les navigateurs actuels le préfèrent et il reste net à
         L'icône est une photo, donc en PNG : pas de favicon.svg, un

         navigateurs le preferent et affichent l'ancien monogramme.
         favicon.ico repond aux agregateurs qui demandent /favicon.ico sans
         lire ces balises. -->
